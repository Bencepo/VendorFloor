name: Release

# Releases come from the changelog: when a push to main brings a new version as the
# top heading of CHANGELOG.md ("## 0.2.0-beta"), this workflow checks the code,
# creates the tag v<version>, builds the zip and uploads it to CurseForge.
# A tag pushed by hand (v*) releases as well.
# Release type follows the version: "-beta" -> beta, "-alpha" -> alpha, otherwise release.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(grep -m1 -E '^## +[0-9]' CHANGELOG.md | sed -E 's/^## +//; s/ .*$//')
          if [ -z "$version" ]; then
            echo "No version heading in CHANGELOG.md"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${tag}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/lint.yml

  release:
    needs: [version, lint]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag the release commit. A tag pushed with GITHUB_TOKEN does not start this workflow again.
      - name: Create tag
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "VendorFloor ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Package and upload
        uses: BigWigsMods/packager@v2
