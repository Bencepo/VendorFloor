name: Feature request
description: An idea that would make VendorFloor better
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help you?
      description: The situation in game where you miss it.
